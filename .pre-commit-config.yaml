repos:
  - repo: local
    hooks:
      - id: rust-linting
        name: Rust linting
        description: Run cargo fmt on files included in the commit. rustfmt should be installed before-hand.
        entry: bash -c 'cargo fmt --all --'
        pass_filenames: true
        types: [file, rust]
        language: system
      - id: cargo-check
        name: Cargo check
        description: Run cargo check on files included in the commit.
        entry: bash -c 'cargo check'
        language: rust
        pass_filenames: true
        types: [file, rust]